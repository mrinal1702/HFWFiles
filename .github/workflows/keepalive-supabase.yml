name: Keepalive (Supabase + App)

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ping Supabase via JS SDK
        run: |
          npm install --quiet @supabase/supabase-js
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            'https://ealowpaiiwsrbwucgkng.supabase.co',
            'sb_publishable_ydw-1nDVFrYckICINYml3Q_Agl46hqz'
          );
          supabase.from('players').select('player_id').limit(1).then(({ data, error }) => {
            if (error) { console.error('Supabase error:', error.message); process.exit(1); }
            console.log('Supabase ping OK, got', data.length, 'row(s)');
          });
          "

      - name: Ping deployed app health endpoint
        run: |
          set -euo pipefail
          echo "Pinging app health endpoint..."
          curl -fsS "https://hfwauction.vercel.app/api/health" -o /tmp/app_health_response.json
          echo "App health ping OK"
